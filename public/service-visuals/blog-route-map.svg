<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Two routes to a useful company blog</title>
  <desc id="desc">Companies with an existing blog follow an audit and improvement route. Companies without a blog follow a structure and launch route. Both lead to regular, measured publishing.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173b70" flood-opacity=".09"/></filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#356df3"/></marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif">
    <text x="50" y="54" font-size="15" font-weight="700" fill="#17243a" letter-spacing="2">BLOG ROUTE MAP</text>
    <text x="1150" y="54" text-anchor="end" font-size="13" fill="#607089">TWO PRACTICAL ROUTES</text>
    <path d="M50 78h1100" stroke="#d6e1ef"/>

    <g filter="url(#s)"><rect x="50" y="112" width="210" height="92" rx="12" fill="#173b70"/></g>
    <text x="76" y="145" font-size="12" font-weight="700" fill="#9fc0ff" letter-spacing="1.2">START</text>
    <text x="76" y="178" font-size="21" font-weight="700" fill="#fff">Your website</text>
    <path d="M260 158h88" stroke="#356df3" stroke-width="2" marker-end="url(#a)"/>

    <g filter="url(#s)"><rect x="360" y="112" width="235" height="92" rx="12" fill="#fff" stroke="#bdcde2"/></g>
    <text x="386" y="145" font-size="12" font-weight="700" fill="#65758d" letter-spacing="1.2">CHECKPOINT</text>
    <text x="386" y="178" font-size="20" font-weight="700" fill="#17243a">Blog already live?</text>

    <path d="M595 139h74v-1h32" stroke="#356df3" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M595 179h74v154h32" stroke="#356df3" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="625" y="128" font-size="12" font-weight="700" fill="#356df3">YES</text>
    <text x="625" y="322" font-size="12" font-weight="700" fill="#356df3">NO</text>

    <g filter="url(#s)"><rect x="714" y="92" width="242" height="132" rx="12" fill="#fff" stroke="#bdcde2"/></g>
    <circle cx="746" cy="126" r="12" fill="#11a683"/>
    <text x="772" y="132" font-size="18" font-weight="700" fill="#17243a">Improve</text>
    <text x="746" y="166" font-size="14" fill="#52637a">Audit → refresh → connect</text>
    <text x="746" y="192" font-size="14" fill="#52637a">services → measure</text>

    <g filter="url(#s)"><rect x="714" y="286" width="242" height="132" rx="12" fill="#fff" stroke="#bdcde2"/></g>
    <circle cx="746" cy="320" r="12" fill="#7c5ce7"/>
    <text x="772" y="326" font-size="18" font-weight="700" fill="#17243a">Build</text>
    <text x="746" y="360" font-size="14" fill="#52637a">Structure → templates → first</text>
    <text x="746" y="386" font-size="14" fill="#52637a">topics → launch</text>

    <path d="M956 158h54v95h31" stroke="#356df3" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M956 352h54v-99h31" stroke="#356df3" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <g filter="url(#s)"><rect x="1053" y="194" width="97" height="118" rx="12" fill="#356df3"/></g>
    <text x="1102" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#cfe0ff">RESULT</text>
    <text x="1102" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Regular</text>
    <text x="1102" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">publishing</text>

    <path d="M50 458h1100" stroke="#d6e1ef"/>
    <text x="50" y="495" font-size="13" fill="#607089">The route changes. The standard does not: useful, accurate and connected to the business.</text>
  </g>
</svg>
