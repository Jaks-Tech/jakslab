<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Company knowledge to customer content pipeline</title>
  <desc id="desc">Documentation, expert interviews and customer questions move through research, editorial review, SEO and AEO, then become useful articles.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173b70" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#356df3"/>
    </marker>
    <style>
      .flow-line { stroke-dasharray: 10 8; animation: flowDash 1.1s linear infinite; }
      .editorial-panel { animation: panelBreathe 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .output-panel { animation: outputBreathe 4.8s ease-in-out infinite 3.4s; transform-box: fill-box; transform-origin: center; }
      .output-accent { stroke-dasharray: 70; stroke-dashoffset: 70; animation: revealAccent 4.8s ease-in-out infinite; }
      @keyframes flowDash { to { stroke-dashoffset: -18; } }
      @keyframes panelBreathe {
        0%, 18%, 100% { opacity: .94; transform: scale(1); }
        36%, 68% { opacity: 1; transform: scale(1.008); }
      }
      @keyframes outputBreathe {
        0%, 30%, 100% { transform: scale(1); }
        45%, 65% { transform: scale(1.018); }
      }
      @keyframes revealAccent {
        0%, 55% { stroke-dashoffset: 70; }
        76%, 92% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -70; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .editorial-panel, .output-panel, .output-accent { animation: none; }
        .motion-particle { display: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#panel)"/>
  <path d="M0 84h1200M0 476h1200" stroke="#d8e4f5"/>
  <text x="52" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17243a" letter-spacing="2">KNOWLEDGE → DEMAND</text>
  <text x="1148" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#607089">FROM SOURCE TO ARTICLE</text>

  <g font-family="Arial, sans-serif">
    <text x="52" y="127" font-size="12" font-weight="700" fill="#65758d" letter-spacing="1.5">SOURCE MATERIAL</text>
    <g filter="url(#shadow)">
      <rect x="52" y="143" width="220" height="48" rx="8" fill="#fff" stroke="#cbd9ec"/>
      <rect x="52" y="201" width="220" height="48" rx="8" fill="#fff" stroke="#cbd9ec"/>
      <rect x="52" y="259" width="220" height="48" rx="8" fill="#fff" stroke="#cbd9ec"/>
      <rect x="52" y="317" width="220" height="48" rx="8" fill="#fff" stroke="#cbd9ec"/>
      <rect x="52" y="375" width="220" height="48" rx="8" fill="#fff" stroke="#cbd9ec"/>
    </g>
    <circle cx="78" cy="167" r="7" fill="#356df3"><animate attributeName="r" values="7;10;7" dur="4.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="225" r="7" fill="#11a683"><animate attributeName="r" values="7;10;7" dur="4.8s" begin=".55s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="283" r="7" fill="#7c5ce7"><animate attributeName="r" values="7;10;7" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="341" r="7" fill="#e08a35"><animate attributeName="r" values="7;10;7" dur="4.8s" begin="1.65s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="399" r="7" fill="#cf4d75"><animate attributeName="r" values="7;10;7" dur="4.8s" begin="2.2s" repeatCount="indefinite"/></circle>
    <text x="98" y="172" font-size="15" font-weight="700" fill="#17243a">Documentation</text>
    <text x="98" y="230" font-size="15" font-weight="700" fill="#17243a">Confluence pages</text>
    <text x="98" y="288" font-size="15" font-weight="700" fill="#17243a">Expert interviews</text>
    <text x="98" y="346" font-size="15" font-weight="700" fill="#17243a">Customer questions</text>
    <text x="98" y="404" font-size="15" font-weight="700" fill="#17243a">Reports and notes</text>

    <path class="flow-line" d="M272 167H333M272 225H333M272 283H333M272 341H333M272 399H333M333 167v232M333 283h48" fill="none" stroke="#356df3" stroke-width="2" marker-end="url(#arrow)"/>
    <g class="motion-particle">
      <circle r="4.5" fill="#356df3"><animateMotion path="M272 167H333V283H381" dur="4.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="4.5" fill="#11a683"><animateMotion path="M272 225H333V283H381" dur="4.8s" begin=".55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin=".55s" repeatCount="indefinite"/></circle>
      <circle r="4.5" fill="#7c5ce7"><animateMotion path="M272 283H381" dur="4.8s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle r="4.5" fill="#e08a35"><animateMotion path="M272 341H333V283H381" dur="4.8s" begin="1.65s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="1.65s" repeatCount="indefinite"/></circle>
      <circle r="4.5" fill="#cf4d75"><animateMotion path="M272 399H333V283H381" dur="4.8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <g filter="url(#shadow)">
      <rect class="editorial-panel" x="390" y="139" width="420" height="250" rx="14" fill="#fff" stroke="#b9ccea"/>
    </g>
    <text x="420" y="176" font-size="12" font-weight="700" fill="#356df3" letter-spacing="1.5">EDITORIAL WORK</text>
    <path d="M420 205h360M420 260h360M420 315h360" stroke="#dbe5f3"/>
    <text x="420" y="237" font-size="16" font-weight="700" fill="#17243a">01  Research and fact map</text>
    <text x="420" y="292" font-size="16" font-weight="700" fill="#17243a">02  Technical review</text>
    <text x="420" y="347" font-size="16" font-weight="700" fill="#17243a">03  Search + answer structure</text>
    <rect x="420" y="365" width="240" height="5" rx="2.5" fill="#dbe5f3"/>
    <rect x="420" y="365" width="0" height="5" rx="2.5" fill="#356df3">
      <animate attributeName="width" values="0;80;156;240;240;0" keyTimes="0;.2;.42;.68;.9;1" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <path class="flow-line" d="M810 264h76" fill="none" stroke="#356df3" stroke-width="2" marker-end="url(#arrow)"/>
    <circle class="motion-particle" r="5" fill="#356df3">
      <animateMotion path="M810 264H886" dur="4.8s" begin="3.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="3.15s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#shadow)">
      <rect class="output-panel" x="897" y="151" width="251" height="226" rx="14" fill="#173b70"/>
    </g>
    <text x="927" y="190" font-size="12" font-weight="700" fill="#9fc0ff" letter-spacing="1.5">PUBLISHED OUTPUT</text>
    <text x="927" y="234" font-size="25" font-weight="700" fill="#fff">Useful articles</text>
    <text x="927" y="268" font-size="15" fill="#d7e4fa">Found by customers.</text>
    <text x="927" y="294" font-size="15" fill="#d7e4fa">Understood by AI search.</text>
    <path class="output-accent" d="M927 326h58" stroke="#6c9dff" stroke-width="4"/><path class="output-accent" d="M998 326h38" stroke="#11c49d" stroke-width="4"/><path class="output-accent" d="M1049 326h69" stroke="#a895ff" stroke-width="4"/>

    <text x="52" y="515" font-size="13" fill="#607089">Every claim stays traceable to an approved company source.</text>
  </g>
</svg>
